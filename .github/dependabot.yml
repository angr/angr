version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "rust"
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "rust-toolchain"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # Versioned in lockstep by the release process and sourced from git
      - dependency-name: "archinfo"
      - dependency-name: "cle"
      - dependency-name: "pysoot"
      - dependency-name: "pyvex"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
