syntax = "proto3";

package angr.protos;

//
// networkx.DiGraph[ailment.Block]
//

enum AilEdgeType {
    AIL_EDGE_TYPE_UNSPECIFIED = 0;
    AIL_EDGE_TRANSITION = 1;
    AIL_EDGE_EXCEPTION = 2;
    AIL_EDGE_FAKE_RETURN = 3;
    AIL_EDGE_CALL = 4;
    AIL_EDGE_SYSCALL = 5;
    AIL_EDGE_RETURN = 6;
}

message AilEdgeData {
    optional AilEdgeType type = 1;
    optional bool outside = 2;
    optional uint64 ins_addr = 3;
    optional sint64 stmt_idx = 4;  // DEFAULT_STATEMENT == -2
    optional bool confirmed = 5;
}

message AilEdge {
    uint32 src = 1;  // index into AilGraph.blocks
    uint32 dst = 2;
    optional AilEdgeData data = 3;
    // When true, the edge's data is AilGraph.default_edge_data overlaid with ``data`` (which then carries only the
    // fields that differ, e.g. a per-edge ins_addr). Lets the common default edge attributes be stored once.
    bool has_default_data = 4;
}

message AilGraph {
    // Either ``blocks`` carries the payloads inline, or ``block_refs`` indexes into a caller-supplied shared pool
    // (e.g. Clinic.block_pool) so that byte-identical blocks shared between graphs are stored once.
    repeated bytes blocks = 1;  // ailment.Block.to_bytes() payloads, in node-insertion order
    repeated AilEdge edges = 2;
    repeated uint32 block_refs = 3;  // indices into the shared pool, in node-insertion order
    // The modal edge-data value (excluding the per-edge ins_addr); edges with has_default_data reference it.
    optional AilEdgeData default_edge_data = 4;
}

//
// dict[int, tuple[ailment.Expr.VirtualVariable, SimVariable]]  (Clinic.arg_vvars, DecompilationCache.arg_vvars)
//

message ArgVVar {
    bytes vvar = 1;    // ailment.Expr.VirtualVariable via Expression.to_bytes()
    bytes simvar = 2;  // polymorphic "<ClassName>\0<proto bytes>" SimVariable encoding
}

message ArgVVars {
    map<int64, ArgVVar> entries = 1;
}

//
// set[tuple[int, ailment.Expr.Expression]]  (DecompilationCache.ite_exprs)
//

message IteExpr {
    int64 addr = 1;
    bytes expr = 2;  // Expression.to_bytes()
}

message IteExprs {
    repeated IteExpr entries = 1;
}

//
// Static buffer parameters (optimization_passes.static_vvar_rewriter)
//

message FixedBufferMsg {
    string ident = 1;
    int64 size = 2;
    bytes content = 3;
}

message FixedBufferPtrMsg {
    string buffer_ident = 1;
    int64 offset = 2;
}

// dict[int, FixedBufferPtr | ailment.Expr.Const]  (decompilation parameter "static_vvars")
message StaticVVar {
    oneof v {
        FixedBufferPtrMsg ptr = 1;
        bytes const_expr = 2;  // Expression.to_bytes()
    }
}

message StaticVVars {
    map<int64, StaticVVar> entries = 1;
}

// dict[str, FixedBuffer]  (decompilation parameter "static_buffers")
message StaticBuffers {
    map<string, FixedBufferMsg> entries = 1;
}

// Normalized external architectural-register state binding. Decompiler API
// register names have already been resolved to exact byte ranges before this
// representation is cached.
message RegisterStateBinding {
    uint64 register_offset = 1;
    uint32 size = 2;
    string c_lvalue = 3;
}

// One normalized register output of a selected call. selector_kind is one of
// "callee_name", "callee_addr", or "callsite_addr". Exactly one of
// selector_name and selector_addr is meaningful for that kind.
message PostCallRegisterStateBinding {
    string selector_kind = 1;
    optional string selector_name = 2;
    optional uint64 selector_addr = 3;
    uint64 register_offset = 4;
    uint32 size = 5;
    string c_identifier = 6;
}

message SegmentedMemoryBinding {
    string address_kind = 1;
    string endness = 2;
    uint32 size = 3;
    optional string load_helper = 4;
    optional string store_helper = 5;
}

// One exact direct far-call binding. kind is "internal" or "external".
// Internal bindings carry a logical runtime segment symbol plus begin/end
// helpers. External bindings carry an exact wrapper symbol and no helpers.
message FarCallBinding {
    uint64 target_addr = 1;
    string kind = 2;
    string target_symbol = 3;
    optional string begin_helper = 4;
    optional string end_helper = 5;
}

message RegisterRange {
    uint64 register_offset = 1;
    uint32 size = 2;
}

// One exact dynamic far-call site. The dispatcher receives the current slot
// selector, the segment-relative slot offset, an optional sealed site
// identifier, then register_inputs in their ABI-significant order. The slot
// offset is either the legacy constant field or an exact architectural
// register; old serialized constant-slot rows therefore remain valid.
message IndirectFarCallBinding {
    uint64 callsite_addr = 1;
    string dispatcher = 2;
    string address_kind = 3;
    uint64 slot_selector_offset = 4;
    uint32 slot_selector_size = 5;
    uint32 slot_offset = 6;
    repeated RegisterRange register_inputs = 7;
    optional RegisterRange slot_offset_register = 8;
    optional uint32 site_identifier = 9;
}

// One exact dynamic protected-mode near-call site. The original target must
// be CS:<target register>. The dispatcher receives the current target offset
// and the sealed site identifier and returns the post-call AX value.
message IndirectNearCallBinding {
    uint64 callsite_addr = 1;
    string dispatcher = 2;
    string address_kind = 3;
    uint64 target_selector_offset = 4;
    uint32 target_selector_size = 5;
    uint64 target_offset = 6;
    uint32 target_size = 7;
    uint32 site_identifier = 8;
}

message ConvertedPointerBinding {
    uint64 callsite_addr = 1;
    uint32 argument_index = 2;
    string helper = 3;
    uint32 span = 4;
    string address_kind = 5;
    string selector_register = 6;
    uint32 selector_offset = 7;
    uint32 selector_size = 8;
    string contract = 9;
    optional sint64 native_stack_offset = 10;
    optional string native_stack_evidence = 11;
}
