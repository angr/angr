[package]
name = "angr"
version = "0.1.0"
edition = "2024"
description = "Native extension for angr, a multi-architecture binary analysis toolkit"
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[lib]
name = "rustylib"
crate-type = ["cdylib"]

[dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pyo3 = { version = "0.29.0", features = [
    "abi3-py312",
    "py-clone",
    "num-bigint",
    "indexmap",
] }
rangemap = "1.7.1"
regex = "1.11"
send_wrapper = "0.6.0"
indexmap = { version = "2.14", features = ["serde"] }
fixedbitset = "0.5"
serde = { version = "1.0.228", features = ["derive", "rc"] }
rustc-hash = "2"
target-lexicon = "0.13.5"

# Icicle's region dependency does not provide its OS query implementation for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
icicle-fuzzing = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "3292602fd4857b53ed653dec69398efe4cdb435e" }
icicle-vm = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "3292602fd4857b53ed653dec69398efe4cdb435e" }
libafl = { version = "=0.16.1" }
libafl_bolts = { version = "=0.16.1" }
pcode = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "3292602fd4857b53ed653dec69398efe4cdb435e" }

[dev-dependencies]
tempfile = "3.27.0"
